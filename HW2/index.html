<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content-Based Movie Recommender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Content-Based Movie Recommender</h1>
        <p>Pick up to three movies you like, and we'll find similar ones for you!</p>

        <div class="controls">
            <label for="movie-select-1">Movie 1</label>
            <select id="movie-select-1">
                <option value="" disabled selected>Select a movie</option>
            </select>
            <label for="movie-select-2">Movie 2 (optional)</label>
            <select id="movie-select-2">
                <option value="">— none —</option>
            </select>
            <label for="movie-select-3">Movie 3 (optional)</label>
            <select id="movie-select-3">
                <option value="">— none —</option>
            </select>
            <button id="recommend-btn" onclick="getRecommendations()">Get Recommendations</button>
        </div>

        <div id="result-box">
            <p id="result">Please wait, loading data...</p>
        </div>

        <div id="profile-box" hidden></div>
        <div id="columns"></div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
